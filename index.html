<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TrueCost</title>
<meta name="description" content="Construction and remodeling estimates from photos with AI.">
<meta name="theme-color" content="#16202B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TrueCost">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: phone-first app shell — sticky top bar, one scrolling column (max 600px), bottom tab bar. Feels like a takeoff sheet: ruled rows, mono figures. */
:root{
  --bg:#EEF0F2; --surface:#FFFFFF; --sunk:#E3E7EB; --line:#D3D9DF;
  --ink:#16202B; --muted:#5B6773; --faint:#8994A0;
  --accent:#1F55C7; --accent-ink:#FFFFFF; --accent-soft:#E2EAFB;
  --mark:#F5C518; --mark-ink:#1B1600;
  --good:#1D7A4C; --warn:#A86200; --bad:#B42318;
  --mat:#1F55C7; --lab:#0E8A7D; --oth:#9A6A00;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --chrome:#16202B; --chrome-ink:#EEF0F2; --chrome-line:transparent; --hl:var(--mark);
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151C; --surface:#18212B; --sunk:#111922; --line:#2A3542;
  --ink:#E7ECF1; --muted:#9AA6B2; --faint:#6B7784;
  --accent:#6E9BFF; --accent-ink:#0B1220; --accent-soft:#1C2A45;
  --mark:#F5C518; --mark-ink:#1B1600;
  --good:#4CC38A; --warn:#E3A33B; --bad:#FF7A6E;
  --mat:#6E9BFF; --lab:#38C5B4; --oth:#E0B341; --chrome:#070B10; --chrome-ink:#E7ECF1; --chrome-line:#2A3542; --hl:rgba(245,197,24,.38); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151C; --surface:#18212B; --sunk:#111922; --line:#2A3542;
  --ink:#E7ECF1; --muted:#9AA6B2; --faint:#6B7784;
  --accent:#6E9BFF; --accent-ink:#0B1220; --accent-soft:#1C2A45;
  --mark:#F5C518; --mark-ink:#1B1600;
  --good:#4CC38A; --warn:#E3A33B; --bad:#FF7A6E;
  --mat:#6E9BFF; --lab:#38C5B4; --oth:#E0B341; --chrome:#070B10; --chrome-ink:#E7ECF1; --chrome-line:#2A3542; --hl:rgba(245,197,24,.38); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--chrome)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-stretch:85%;text-wrap:balance;margin:0;line-height:1.15}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--chrome);color:var(--chrome-ink);border-bottom:1px solid var(--chrome-line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.top-in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:32px}
.brand{font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:22px;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:14px;height:14px;background:var(--mark);border-radius:2px;transform:rotate(45deg)}
.top .back{background:none;border:0;padding:4px 6px 4px 0;font-size:15px;display:flex;align-items:center;gap:4px;color:inherit}
.top .ttl{font-family:var(--f-display);font-weight:700;font-stretch:85%;font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:10px 2px 9px;min-width:0;text-align:center;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
.tab.cam{color:var(--ink)}
.tab.cam .dot{width:44px;height:44px;margin-top:-22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 0 0 4px var(--surface)}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{padding:14px 18px;font-size:16px;width:100%}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;color:var(--ink);font-size:15px}
textarea.in{min-height:96px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.badge{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.badge.ex{background:var(--mark);color:var(--mark-ink)}
.note{border-left:3px solid var(--warn);background:var(--surface);padding:10px 12px;border-radius:0 8px 8px 0;font-size:13.5px}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}

/* hero on home */
.hero{background:var(--chrome);color:var(--chrome-ink);border:1px solid var(--chrome-line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero h1{font-size:30px;font-weight:800;font-stretch:78%;letter-spacing:-.005em}
.hero h1 b{background:var(--mark);color:var(--mark-ink);padding:0 6px}
.hero p{margin:0;opacity:.8;max-width:42ch}
.hero .ruler{position:absolute;right:-6px;top:0;bottom:0;width:26px;background:repeating-linear-gradient(to bottom,var(--mark) 0 2px,transparent 2px 10px);opacity:.55;mask:linear-gradient(to left,#000 40%,transparent)}
.hero .btn.primary{background:var(--mark);border-color:var(--mark);color:var(--mark-ink);align-self:flex-start}

/* project list */
.plist{display:flex;flex-direction:column;gap:10px}
.pitem{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px;text-align:left;width:100%}
.thumb{width:64px;height:64px;border-radius:8px;background:var(--sunk) center/cover no-repeat;display:grid;place-items:center;color:var(--faint)}
.pitem .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .tot{font-family:var(--f-mono);font-weight:600;font-size:15px;text-align:right}

/* photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--sunk);max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1}
.addph{aspect-ratio:1;border:1.5px dashed var(--line);border-radius:8px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
.addph svg{width:26px;height:26px;color:var(--accent)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* steps */
.steps{display:flex;gap:6px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--accent)}

/* thinking */
.think{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.scan{width:100%;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;position:relative}
.scan::after{content:"";position:absolute;inset:0;width:35%;background:var(--accent);border-radius:3px;animation:scan 1.4s ease-in-out infinite}
@keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(290%)}}
@media (prefers-reduced-motion:reduce){.scan::after{animation:none;width:100%;opacity:.4}}
.stream{font-family:var(--f-mono);font-size:11.5px;color:var(--faint);max-height:90px;overflow:hidden;white-space:pre-wrap;word-break:break-all;mask:linear-gradient(to top,#000 60%,transparent)}

/* estimate */
.total{display:flex;flex-direction:column;gap:12px}
.total .big{font-family:var(--f-mono);font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.total .big .hl{background:linear-gradient(transparent 58%,var(--hl) 58% 92%,transparent 92%);padding:0 2px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{width:10px;height:10px;border-radius:2px;display:inline-block}
.grp{overflow:hidden}
.grp-h{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--sunk);border-bottom:1px solid var(--line)}
.grp-h h3{font-size:17px;font-weight:700;flex:1;min-width:0}
.grp-h .num{font-weight:600}
.kind{padding:10px 16px 2px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
.it{display:grid;grid-template-columns:4px 1fr auto;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:start;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.it:last-child{border-bottom:0}
.it .k{width:4px;align-self:stretch;border-radius:2px}
.it .nm{font-weight:500}
.it .sub{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.it .amt{font-family:var(--f-mono);font-weight:600;white-space:nowrap}
.edit{padding:12px 16px;background:var(--accent-soft);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.edit .grid3{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
.edit .in{padding:8px 10px;font-size:14px}
.adj{display:flex;flex-direction:column}
.adj .r{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.adj .r:last-child{border-bottom:0}
.adj .r .in{width:76px;text-align:right;padding:6px 8px}
.adj .r .num{min-width:110px;text-align:right}
.adj .r.tt{font-weight:700;border-top:2px solid var(--ink);border-bottom:0;margin-top:4px}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.ask{display:flex;gap:8px;align-items:flex-end}
.ask textarea{min-height:46px;flex:1}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.msgbox{white-space:pre-wrap;font-size:14px;background:var(--sunk);border-radius:8px;padding:12px;user-select:text}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--bad);border-radius:8px;padding:10px 12px}
.pb-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:center}
.pb-row:last-child{border-bottom:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 12px;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.meas{display:grid;grid-template-columns:1fr 90px 64px;gap:8px;align-items:center}
.meas .in{padding:7px 9px;font-size:14px}
.saved{display:flex;gap:6px;align-items:center;color:var(--good)}
.langsw{margin-left:auto;display:inline-flex;border:1px solid color-mix(in srgb,var(--chrome-ink) 30%,transparent);border-radius:7px;overflow:hidden;flex:none}
.langsw button{background:none;border:0;color:inherit;font-size:12px;font-weight:600;letter-spacing:.05em;padding:5px 8px;opacity:.7}
.langsw button[aria-pressed="true"]{background:var(--mark);color:var(--mark-ink);opacity:1}
</style>
</head>

    if(!this.db) return this.readLocal();

function mapErr(Anthropic, e){

  if(e instanceof Anthropic.AuthenticationError || e instanceof Anthropic.PermissionDeniedError) return { code:"bad_key" };

  if(e instanceof Anthropic.BadRequestError) return { code:"bad_request", message: e.message };

    throw { code:"local_fail", message:String(e?.message || e) };
  }
  finally{ opts.signal?.removeEventListener("abort", stop); }
  if(opts.signal?.aborted) throw { code:"cancelled" };
  text = text.replace(/<think>[\s\S]*?<\/think>/g, "").trim();
  if(!text) throw { code:"empty_completion" };
  return { text, truncated:false };
}

/* ---------- totals ---------- */
function totals(p){
  const e = p.estimate || { groups:[] };
  const by = { material:0, labor:0, other:0 };
  e.groups.forEach(g => g.items.forEach(it => { by[KIND_COLOR[it.kind] ? it.kind : "other"] += num(it.qty) * num(it.unitPrice); }));
  const sub = by.material + by.labor + by.other;
  const a = p.adj || state.settings;
  const cont = sub * num(a.contingency) / 100;
  const mk = (sub + cont) * num(a.markup) / 100;
  const tax = (sub + cont + mk) * num(a.tax) / 100;
  const total = sub + cont + mk + tax;
  const r = num(e.rangePct) / 100;
  return { by, sub, cont, mk, tax, total, low: total * (1 - r), high: total * (1 + r) };
}
const groupSum = g => g.items.reduce((s, it) => s + num(it.qty) * num(it.unitPrice), 0);
const pm = (p, v) => money(v, p.currency);

function normalizeEstimate(e){
  if(!e || !Array.isArray(e.groups)) throw { code:"invalid_json" };
  const n = v => typeof v === "number" ? v : parseFloat(String(v ?? "").replace(/[^0-9.\-]/g, "")) || 0;
  e.groups = e.groups.filter(g => g && Array.isArray(g.items)).map(g => ({
    name:String(g.name || t("item")),
    items:g.items.map(it => ({ kind: KIND_COLOR[it.kind] ? it.kind : "other", name:String(it.name || t("item")), qty:n(it.qty) || 1, unit:String(it.unit || "ea"), unitPrice:n(it.unitPrice), note: it.note ? String(it.note) : "" }))
  }));
  ["assumptions","exclusions"].forEach(k => e[k] = Array.isArray(e[k]) ? e[k].map(String) : []);
  e.upsells = Array.isArray(e.upsells) ? e.upsells.map(u => ({ name:String(u.name || ""), price:n(u.price) })).filter(u => u.name) : [];
  e.rangePct = Math.min(40, Math.max(5, n(e.rangePct) || 15));
  return e;
}

function loadImg(file){ return new Promise((res, rej) => { const u = URL.createObjectURL(file); const im = new Image(); im.onload = () => res({ im, u }); im.onerror = rej; im.src = u; }); }
async function shrink(file, max, q){
  const { im, u } = await loadImg(file);
  const k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement("canvas"); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
  c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
  URL.revokeObjectURL(u);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", q));
  return { blob, dataUrl: max <= 240 ? c.toDataURL("image/jpeg", q) : null };
}
async function addFiles(files){

      d.photos.push({ id:uid(), blob:big.blob, url:URL.createObjectURL(big.blob), thumb:small.dataUrl });
    }catch{ toast(t("badImage")); }
  }
  render();
}

/* ---------- AI flows ---------- */
let ctl = null;
async function runAI(labelKey, prompt, opts){
  ctl = new AbortController();
  state.busy = { label:labelKey, text:"", hasText:false }; render();
  try{
    return await state.sample.json(prompt, { ...opts, signal: ctl.signal, modelTier: state.settings.tier || "default",
      onProgress: r => { if(!state.busy) return; state.busy.text = `${t("loadingModel")} · ${Math.round((r.progress || 0) * 100)}%\n${r.text || ""}`; const st = $("#stream"); if(st) st.textContent = state.busy.text; },
      onText: ({ text }) => { if(!state.busy) return; state.busy.text = text.slice(-600); state.busy.hasText = true; const st = $("#stream"); if(st){ st.textContent = state.busy.text; st.scrollTop = st.scrollHeight; } else render(); } });
  } finally { state.busy = null; }
}

async function doAnalyze(){
  const d = state.draft;
  d.description = $("#desc").value.trim(); d.location = $("#loc").value.trim();
  const imgs = photosToAI() ? d.photos.map(p => p.blob) : [];
  try{
    const a = await runAI("busyAnalyze", ANALYZE_PROMPT({ nPhotos: imgs.length, description: d.description, location: d.location }), { schema:ANALYSIS_SCHEMA, ...(imgs.length ? { images: imgs } : {}) });
    if(!a || typeof a !== "object") throw { code:"invalid_json" };
    a.questions = (Array.isArray(a.questions) ? a.questions : []).slice(0, 5).map((q, i) => ({ id: String(q.id || "q" + (i + 1)), question: String(q.question || ""), options: Array.isArray(q.options) ? q.options.map(String).slice(0, 4) : [] })).filter(q => q.question);
    a.measurements = (Array.isArray(a.measurements) ? a.measurements : []).map(m => ({ label:String(m.label || ""), value:m.value, unit:String(m.unit || ""), basis: m.basis ? String(m.basis) : "" }));
    const p = { id:uid(), name: a.title || t("newProject"), createdAt:Date.now(), updatedAt:Date.now(), description:d.description, location:d.location,
      currency: state.settings.currency, units: state.settings.units, lang: lang(),
      thumbs: d.photos.slice(0, 4).map(x => x.thumb).filter(Boolean), analysis:a, estimate:null,
      adj:{ contingency:state.settings.contingency, markup:state.settings.markup, tax:state.settings.tax } };
    d.project = p; d.step = 2; d.answers = {}; d.custom = {}; clearDraftText();
    state.projects.push(p); saveProject(p, true);
  }catch(e){ if(e?.code !== "cancelled") toast(aiErr(e)); }
  render(); window.scrollTo(0, 0);
}

async function doEstimate(){
  const d = state.draft, p = d.project;
  d.extra = $("#extra")?.value.trim() || "";
  const answers = (p.analysis.questions || []).map(q => ({ question:q.question, answer: d.custom[q.id]?.trim() || d.answers[q.id] || t("notGiven") }));
  if(d.extra) answers.push({ question:t("extraQ"), answer:d.extra });
  p.answers = answers;
  const imgs = photosToAI() ? d.photos.map(x => x.blob) : [];
  try{
    const e = normalizeEstimate(await runAI("busyEstimate", ESTIMATE_PROMPT(p, { answers, nPhotos: imgs.length }), { schema:ESTIMATE_SCHEMA, ...(imgs.length ? { images: imgs } : {}) }));
    p.estimate = e; if(e.title) p.name = e.title;
    saveProject(p, true);
    d.photos.forEach(x => URL.revokeObjectURL(x.url));
    state.draft = null;
    go({ name:"project", id:p.id }); state.tab = "projects"; renderTabs();
    return;
  }catch(err){ if(err?.code !== "cancelled") toast(aiErr(err)); }
  render();
}

async function doRefine(p){
  const instr = $("#refine").value.trim(); if(!instr) return;
  state.refineDraft = instr;
  try{
    const e = normalizeEstimate(await runAI("busyRefine", REFINE_PROMPT(p, instr), { cache:false, schema:ESTIMATE_SCHEMA }));
    p.estimate = e; state.refineDraft = ""; saveProject(p, true); toast(t("updated"));
  }catch(err){ if(err?.code !== "cancelled") toast(aiErr(err)); }
  render();
}

async function doClientMsg(p){
  const tt = totals(p);
  state.clientMsg = { loading:true }; render();
  const prompt = `Write a short, professional message (to send by text message or email) presenting this estimate to the client. Write it in ${LANG_NAME[lang()]}. Friendly and direct, no emoji overload, don't invent facts.
Sender: ${state.settings.company || "(no name)"}
Work: ${p.estimate.scope || p.description}
Total: ${pm(p, tt.total)} (range ${pm(p, tt.low)} to ${pm(p, tt.high)})
Duration: ${p.estimate.durationDays || "to be scheduled"} day(s). Crew: ${p.estimate.crew || "-"}
Included (phases): ${p.estimate.groups.map(g => g.name).join(", ")}
Not included: ${p.estimate.exclusions.join("; ") || "-"}
End by asking for confirmation and saying the price is valid for 15 days. Reply with the message text only.`;
  try{ const { text } = await state.sample(prompt, { modelTier:"quick", cache:false }); state.clientMsg = { text }; }
  catch(e){ state.clientMsg = null; toast(aiErr(e)); }
  render();
}

/* ---------- export ---------- */
function plainText(p){
  const tt = totals(p), e = p.estimate, L = [];
  L.push(`${t("quoteT").toUpperCase()} — ${p.name}`); if(state.settings.company) L.push(state.settings.company);
  L.push(`${fmtDate(Date.now())} · ${p.location || ""}`, "", e.scope || p.description, "");
  e.groups.forEach(g => { L.push(`■ ${g.name} — ${pm(p, groupSum(g))}`); g.items.forEach(it => L.push(`  • ${it.name}: ${fmtQty(it.qty)} ${it.unit} × ${pm(p, it.unitPrice)} = ${pm(p, num(it.qty) * num(it.unitPrice))}`)); L.push(""); });
  L.push(`${t("directCost")}: ${pm(p, tt.sub)}`);
  if(tt.cont) L.push(`${t("contingency")}: ${pm(p, tt.cont)}`); if(tt.mk) L.push(`${t("markup")}: ${pm(p, tt.mk)}`); if(tt.tax) L.push(`${t("tax")}: ${pm(p, tt.tax)}`);
  L.push(`${t("total").toUpperCase()}: ${pm(p, tt.total)}`, "");
  if(e.durationDays) L.push(`${t("durationL")}: ${t("daysN", { n:e.durationDays })}`);
  if(e.exclusions.length) L.push(`${t("exclusions")}: ${e.exclusions.join("; ")}`);
  return L.join("\n");
}

function csv(p){
  const pt = lang() === "pt", sep = pt ? ";" : ",";
  const q = v => `"${String(v).replace(/"/g, '""')}"`;
  const d = v => { const s = num(v).toFixed(2); return pt ? s.replace(".", ",") : s; };
  const L = [t("csvHead").map(q).join(sep)];
  p.estimate.groups.forEach(g => g.items.forEach(it => L.push([g.name, kindLabel(it.kind), it.name, pt ? String(it.qty).replace(".", ",") : String(it.qty), it.unit, d(it.unitPrice), d(num(it.qty) * num(it.unitPrice))].map(q).join(sep))));
  return "﻿" + L.join("\n");
}
async function download(filename, data){
  if(IN_CLAUDE){
    const dl = await window.claude.use("downloads");
    if(!dl){ toast(t("copyManual")); return; }
    try{ const r = await dl.save({ filename, data }); if(r?.status === "saved") toast(t("saved")); }
    catch(e){ if(e?.code !== "cancelled" && e?.code !== "declined") toast(t("notSaved")); }
    return;
  }
  const type = filename.endsWith(".csv") ? "text/csv;charset=utf-8" : filename.endsWith(".json") ? "application/json;charset=utf-8" : filename.endsWith(".pdf") ? "application/pdf" : "text/html;charset=utf-8";
  const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], { type }));
  const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast(t("downloaded"));
}
async function copy(text){

  catch{ const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); toast(t("copied")); }catch{ toast(t("copyManual")); } ta.remove(); }
}
const slug = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "estimate";

/* ---------- PDF ---------- */
const PDF_LIBS = ["https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js", "https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"];
const loadScript = src => new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
let pdfLib = null;
const loadPDF = () => (pdfLib ||= (async () => { for(const u of PDF_LIBS) await loadScript(u); return window.jspdf.jsPDF; })().catch(e => { pdfLib = null; throw e; }));
/* The built-in PDF fonts only cover Latin-1 (WinAnsi): map the few typographic characters the AI uses, drop the rest. */
const pdfText = s => String(s ?? "").replace(/[\u202F\u2009]/g, " ").replace(/≈/g, "~").replace(/′/g, "'").replace(/″/g, '"').replace(/■/g, "-")
  .replace(/[^\x00-\xFF\u2013\u2014\u2018\u2019\u201C\u201D\u2022\u2026\u20AC]/g, "");
const imgSize = src => new Promise(res => { const im = new Image(); im.onload = () => res([im.naturalWidth, im.naturalHeight]); im.onerror = () => res(null); im.src = src; });

async function buildPDF(p){
  const jsPDF = await loadPDF();
  const doc = new jsPDF({ unit:"pt", format: state.settings.units === "metric" ? "a4" : "letter" });
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 48, CW = W - M * 2;
  const INK = [22,32,43], MUTED = [91,103,115], LINE = [211,217,223], SUNK = [238,240,242], MARK = [245,197,24];
  const tt = totals(p), e = p.estimate, s = state.settings, $m = v => pdfText(pm(p, v));
  let y = 0;
  const need = h => { if(y + h > H - M - 24){ doc.addPage(); y = M; } };
  const para = (txt, size = 10, color = INK, gap = 4) => {
    doc.setFont("helvetica", "normal"); doc.setFontSize(size); doc.setTextColor(...color);
    for(const line of doc.splitTextToSize(pdfText(txt), CW)){ need(size * 1.35); doc.text(line, M, y + size); y += size * 1.35; }
    y += gap;
  };
  const heading = txt => { need(28); y += 8; doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(...MUTED); doc.text(pdfText(txt).toUpperCase(), M, y + 9, { charSpace: .6 }); y += 16; };

  // header band
  doc.setFillColor(...INK); doc.rect(0, 0, W, 76, "F");
  doc.setFillColor(...MARK); doc.lines([[7,7],[-7,7],[-7,-7],[7,-7]], M + 7, 31, [1,1], "F", true);
  doc.setTextColor(255,255,255); doc.setFont("helvetica", "bold"); doc.setFontSize(17);
  doc.text(pdfText(s.company || "TrueCost"), M + 22, 43);
  doc.setFontSize(10); doc.setTextColor(...MARK); doc.text(pdfText(t("quoteT")).toUpperCase(), W - M, 34, { align:"right", charSpace: 1 });
  doc.setFont("helvetica", "normal"); doc.setTextColor(220,226,232); doc.text(pdfText(fmtDate(Date.now())), W - M, 50, { align:"right" });
  y = 104;

  // title block
  doc.setFont("helvetica", "bold"); doc.setFontSize(20); doc.setTextColor(...INK);
  for(const line of doc.splitTextToSize(pdfText(p.name), CW)){ doc.text(line, M, y); y += 24; }
  doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(...MUTED);
  doc.text(pdfText([p.location, t("validFor")].filter(Boolean).join("  ·  ")), M, y); y += 20;
  para(e.scope || p.description, 10.5, INK, 6);

  // photos
  const thumbs = (p.thumbs || []).slice(0, 4);
  if(thumbs.length){
    heading(t("pdfPhotos"));
    const gap = 10, bw = (CW - gap * 3) / 4, bh = bw * .75; need(bh + 6);
    for(let i = 0; i < thumbs.length; i++){
      const sz = await imgSize(thumbs[i]); if(!sz) continue;
      const k = Math.min(bw / sz[0], bh / sz[1]), w = sz[0] * k, h = sz[1] * k, x = M + i * (bw + gap);
      doc.setFillColor(...SUNK); doc.rect(x, y, bw, bh, "F");
      try{ doc.addImage(thumbs[i], "JPEG", x + (bw - w) / 2, y + (bh - h) / 2, w, h); }catch{}
    }
    y += bh + 10;
  }

  // line items
  const body = [];
  e.groups.forEach(g => {
    body.push([{ content:pdfText(g.name), colSpan:4, styles:{ fontStyle:"bold", fillColor:SUNK } }, { content:$m(groupSum(g)), styles:{ fontStyle:"bold", fillColor:SUNK, halign:"right" } }]);
    g.items.forEach(it => body.push([pdfText(it.name), pdfText(fmtQty(it.qty)), pdfText(it.unit), $m(it.unitPrice), $m(num(it.qty) * num(it.unitPrice))]));
  });
  doc.autoTable({
    startY: y + 4, margin: { left:M, right:M, bottom:M + 24 }, theme:"plain",
    head: [[t("item"), t("qty"), t("unit"), t("unitPrice"), t("total")].map(pdfText)],
    body,
    styles: { font:"helvetica", fontSize:9.5, textColor:INK, cellPadding:{ top:5, bottom:5, left:6, right:6 }, lineColor:LINE, lineWidth:{ bottom:.5 } },
    headStyles: { fontStyle:"bold", fontSize:8.5, textColor:MUTED, lineWidth:{ bottom:1 }, lineColor:INK },
    columnStyles: { 1:{ halign:"right", cellWidth:50 }, 2:{ cellWidth:52 }, 3:{ halign:"right", cellWidth:80 }, 4:{ halign:"right", cellWidth:86 } },
    didParseCell: d => { if(d.section === "head" && d.column.index !== 0 && d.column.index !== 2) d.cell.styles.halign = "right"; }
  });
  y = doc.lastAutoTable.finalY + 14;

  // totals
  const rows = [[t("directCost"), tt.sub], tt.cont && [t("contingency") + ` (${fmtQty(p.adj.contingency)}%)`, tt.cont], tt.mk && [t("markup") + ` (${fmtQty(p.adj.markup)}%)`, tt.mk], tt.tax && [t("tax") + ` (${fmtQty(p.adj.tax)}%)`, tt.tax]].filter(Boolean);
  const TX = W - M - 250;
  need(rows.length * 18 + 60);
  doc.setFontSize(10);
  rows.forEach(([l, v]) => { doc.setFont("helvetica", "normal"); doc.setTextColor(...MUTED); doc.text(pdfText(l), TX, y + 10); doc.setTextColor(...INK); doc.text($m(v), W - M, y + 10, { align:"right" }); y += 18; });
  doc.setDrawColor(...INK); doc.setLineWidth(1.2); doc.line(TX, y + 2, W - M, y + 2); y += 8;
  doc.setFillColor(...MARK); doc.rect(TX - 6, y, W - M - TX + 12, 28, "F");
  doc.setFont("helvetica", "bold"); doc.setFontSize(14); doc.setTextColor(27,22,0);
  doc.text(pdfText(t("total")).toUpperCase(), TX, y + 19); doc.text($m(tt.total), W - M, y + 19, { align:"right" }); y += 40;
  doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(...MUTED);
  doc.text(pdfText(`${t("likely")}: ${pm(p, tt.low)} – ${pm(p, tt.high)}`), W - M, y, { align:"right" }); y += 12;

  // terms
  if(e.durationDays){ heading(t("durationL")); para(t("daysN", { n:e.durationDays }) + (e.crew ? " · " + e.crew : "")); }
  if(e.assumptions.length){ heading(t("assumptions")); e.assumptions.forEach(x => para("•  " + x, 10, INK, 0)); y += 4; }
  if(e.exclusions.length){ heading(t("exclusions")); e.exclusions.forEach(x => para("•  " + x, 10, INK, 0)); y += 4; }

  // acceptance
  need(110); heading(t("acceptT")); para(t("acceptP"), 9.5, MUTED, 30);
  doc.setDrawColor(...MUTED); doc.setLineWidth(.6);
  doc.line(M, y, M + CW * .6, y); doc.line(M + CW * .68, y, W - M, y);
  doc.setFontSize(8.5); doc.setTextColor(...MUTED);
  doc.text(pdfText(t("sigClient")), M, y + 12); doc.text(pdfText(t("sigDate")), M + CW * .68, y + 12);

  // footer on every page
  const n = doc.getNumberOfPages();
  for(let i = 1; i <= n; i++){
    doc.setPage(i); doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(...MUTED);
    doc.text(pdfText(`${s.company ? s.company + "  ·  " : ""}${t("genWith")}`), M, H - 26);
    doc.text(pdfText(t("pageOf", { a:i, b:n })), W - M, H - 26, { align:"right" });
  }
  return doc.output("blob");
}
async function doPDF(p){
  if(state.pdfBusy) return;
  state.pdfBusy = true; render();
  try{
    const blob = await buildPDF(p);
    state.pdfBusy = false; render();
    await download(`${slug(t("quoteT"))}-${slug(p.name)}.pdf`, blob);
  }catch(e){ console.warn(e); state.pdfBusy = false; render(); toast(t("pdfFail")); }
}

      if(i > -1) state.pricebook[i] = row; else state.pricebook.unshift(row);
      savePricebook(); toast(i > -1 ? t("priceUpdated") : t("priceSaved")); break; }
    case "additem": { const g = p.estimate.groups[+b.dataset.g]; g.items.push({ kind:"material", name:t("newItem"), qty:1, unit:"ea", unitPrice:0, note:"" }); state.editing = { gi:+b.dataset.g, ii:g.items.length - 1 }; touch(); break; }
    case "addpb": state.pbPick = +b.dataset.g; openPicker(); break;
    case "addgroup": p.estimate.groups.push({ name:t("newPhase"), items:[{ kind:"labor", name:kindLabel("labor"), qty:1, unit:"hr", unitPrice:num(state.settings.laborRate), note:"" }] }); state.editing = { gi:p.estimate.groups.length - 1, ii:0 }; touch(); break;
    case "upsell": { const u = p.estimate.upsells.splice(+b.dataset.i, 1)[0]; const gname = t("addonsGroup"); let g = p.estimate.groups.find(x => x.name === gname); if(!g){ g = { name:gname, items:[] }; p.estimate.groups.push(g); } g.items.push({ kind:"other", name:u.name, qty:1, unit:"lot", unitPrice:u.price, note:"" }); touch(); toast(t("addonAdded")); break; }

    case "pick": { const pr = getProject(state.route.id); const it = state.pricebook[+b.dataset.i]; pr.estimate.groups[state.pbPick].items.push({ kind: /labor|mano de obra|m[aã]o de obra|servi/i.test(it.cat || "") ? "labor" : "material", name:it.name, qty:1, unit:it.unit, unitPrice:it.price, note:"" }); closePicker(); saveProject(pr); render(); break; }
    case "closepick": closePicker(); break;
    case "psort": state.psort = b.dataset.k; render(); break;
    case "set": state.settings[b.dataset.k] = b.dataset.v; saveSettings();

      (async () => {
        try{ const w = await loadWebLLM(); if(localEngine){ await localEngine.unload(); localEngine = null; localEngineId = null; } await w.deleteModelAllInfoInCache(localDownloaded()); }catch(e){ console.warn(e); }

function liveTotals(p){
  const tt = totals(p); const big = document.querySelector(".total .big .hl"); if(big) big.textContent = pm(p, tt.total);
  const el = document.querySelector(".adj .r.tt .num"); if(el) el.textContent = pm(p, tt.total);
}
document.addEventListener("change", async e => {
  if(e.target.id !== "restoreIn" || !e.target.files[0]) return;
  try{
    const obj = JSON.parse(await e.target.files[0].text());
    if(obj?.app !== "truecost" || typeof obj.data !== "object") throw 0;
    for(const [k, v] of Object.entries(obj.data)) if(k === "settings" || k === "pricebook" || k.startsWith("p_")) await Store.put(k, v);
    await loadState(); render();
    toast(t("backupOk", { n:state.projects.length }));
  }catch{ toast(t("backupBad")); }
  e.target.value = "";
});
document.addEventListener("submit", e => {
  if(e.target.id === "keyform"){
    e.preventDefault();
    const v = $("#apikey").value.trim();
    if(!/^sk-ant-/.test(v)){ state.keyStatus = { ok:false, msg:t("keyBadFormat") }; render(); return; }
    try{ localStorage.setItem(KEY_LS, v); }catch{ toast(t("keyBlocked")); return; }
    state.keyStatus = { ok:true, msg:t("keySaved") };
    initAI(); render(); return;
  }
  if(e.target.id !== "pbform") return; e.preventDefault();
  const name = $("#pb-n").value.trim(), unit = $("#pb-u").value.trim(), price = num($("#pb-p").value), cat = $("#pb-c").value.trim();
  if(!name || !unit) return;
  state.pricebook.unshift({ name, unit, price, cat }); savePricebook(); render(); toast(t("priceAdded")); $("#pb-n")?.focus();
});

/* price-list picker (inline sheet) */
function openPicker(){
  closePicker();
  const sh = document.createElement("div"); sh.id = "picker"; sh.className = "card";
  sh.style.cssText = "position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:568px;margin:0 auto;max-height:55vh;overflow:auto;z-index:15;box-shadow:0 10px 40px rgba(0,0,0,.25)";
  sh.innerHTML = `<div class="row" style="padding:12px 16px;border-bottom:1px solid var(--line)"><b class="grow">${t("pickT")}</b><button class="btn ghost" data-act="closepick">${t("close")}</button></div>` +
    state.pricebook.map((p, i) => `<button class="pb-row" style="width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left" data-act="pick" data-i="${i}"><span>${esc(p.name)}<br><span class="small muted">${esc(t("per", { u:p.unit }))}</span></span><span class="num">${money(p.price)}</span></button>`).join("");
  document.body.appendChild(sh);
}
function closePicker(){ document.getElementById("picker")?.remove(); }

/* ---------- boot ---------- */
async function loadState(){
  const all = await Store.loadAll();
  // Projects made before currency was stored per project were priced in the v1 settings currency (BRL by default).
  const legacyCurrency = all.settings?.legacyCurrency || (all.settings?.v ? "USD" : (all.settings?.currency || "BRL"));
  if(all.settings){
    const s = { ...DEFAULT_SETTINGS, ...all.settings };
    if(!all.settings.v){   // v1 settings were Brazil-first: move them to the US defaults once
      s.v = 2; s.legacyCurrency = all.settings.currency || "BRL"; s.currency = "USD"; s.units = "imperial";
      if(!all.settings.lang) s.lang = state.settings.lang;
      if(all.settings.region === "São Paulo, SP") s.region = "";
      if(all.settings.laborRate === 45) s.laborRate = 65;
      Store.put("settings", s);
    }
    if(s.units === "métrico") s.units = "metric";
    state.settings = s;
  }
  if(all.pricebook?.items) state.pricebook = all.pricebook.items;
  state.projects = Object.keys(all).filter(k => k.startsWith("p_")).map(k => {
    const p = all[k];
    if(!p.currency){ p.currency = legacyCurrency; Store.put(k, p); }   // persist once so later loads don't guess
    return p;
  });
  try{ localStorage.setItem("truecost.lang", state.settings.lang); }catch{}
}
async function boot(){
  // Web install: cache the app so it opens without internet (the on-device model is cached by WebLLM).
  if(!IN_CLAUDE && "serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
  render();
  initAI();
  await Store.init();
  try{ await loadState(); }
  catch(e){ console.warn(e); toast(t("loadFail")); }
  if(!IN_CLAUDE){
    let run = null; try{ run = JSON.parse(localStorage.getItem(RUN_LS) || "null"); }catch{}
    if(run && Date.now() - run.t < 15 * 60 * 1000){
      if(state.settings.localModel === "better"){ state.settings.localModel = "fast"; saveSettings(); state.crash = "crashSwitched"; }
      else state.crash = "crashNote";
      if(state.draft === null && localStorage.getItem(DRAFT_LS)) state.route = { name:"new" }, state.tab = "new", newDraft();
    }
    markRun(false);
  }
  initAI();   // settings are loaded now (engine and model choice)
  state.loaded = true;
  render();
}
boot();
})();
</script>
